<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        EduGenie - AI Learning Assistant
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='style.css') }}"
    >

</head>


<body>


<div class="app-container">


    <!-- =================================================
         HEADER
    ================================================== -->

    <header class="header">

        <div>

            <div class="brand-small">
                AI POWERED LEARNING
            </div>

            <h1>
                EduGenie
            </h1>

            <p>
                Your AI-powered personal learning assistant.
            </p>

        </div>


        <div class="status">

            <span class="status-circle"></span>

            Online

        </div>

    </header>


    <!-- =================================================
         MAIN FORM
    ================================================== -->

    <section class="card">

        <label for="task">

            Choose a learning task

        </label>


        <select id="task">

            <option value="qa">
                Question & Answer
            </option>

            <option value="explain">
                Explain a Concept
            </option>

            <option value="quiz">
                Generate Quiz
            </option>

            <option value="summarize">
                Summarize Text
            </option>

            <option value="learn">
                Learning Path
            </option>

        </select>


        <label for="inputText">

            Enter your question, topic or text

        </label>


        <textarea
            id="inputText"
            placeholder="Example: Which is the largest ocean?"
        ></textarea>


        <div class="button-row">

            <button
                id="generateBtn"
                class="primary-button"
            >

                Generate

            </button>


            <button
                id="clearBtn"
                class="secondary-button"
            >

                Clear

            </button>

        </div>


        <div
            id="error"
            class="error"
            hidden
        ></div>

    </section>


    <!-- =================================================
         RESULT
    ================================================== -->

    <section class="card result-card">

        <div class="result-header">

            <h2>
                Result
            </h2>


            <button
                id="copyBtn"
                class="copy-button"
                disabled
            >

                Copy

            </button>

        </div>


        <div
            id="result"
            class="result"
        >

            Your AI-generated result
            will appear here.

        </div>

    </section>


</div>


<script>


// =======================================================
// DOM ELEMENTS
// =======================================================

const task =
    document.getElementById("task");

const inputText =
    document.getElementById("inputText");

const generateBtn =
    document.getElementById("generateBtn");

const clearBtn =
    document.getElementById("clearBtn");

const result =
    document.getElementById("result");

const errorBox =
    document.getElementById("error");

const copyBtn =
    document.getElementById("copyBtn");


// =======================================================
// PLACEHOLDERS
// =======================================================

const placeholders = {

    qa:
        "Example: Which is the largest ocean?",

    explain:
        "Example: Explain the Pythagoras theorem.",

    quiz:
        "Paste an educational passage here.",

    summarize:
        "Paste a long educational passage here.",

    learn:
        "Example: SQL"
};


task.addEventListener(
    "change",
    function () {

        inputText.placeholder =
            placeholders[task.value];

    }
);


// =======================================================
// HTML ESCAPE
// =======================================================

function escapeHtml(value) {

    return value.replace(
        /[&<>"']/g,

        function (character) {

            const entities = {

                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"
            };

            return entities[
                character
            ];

        }
    );
}


// =======================================================
// QUIZ DISPLAY
// =======================================================

function renderQuiz(data) {

    if (data.error) {

        return `
            <div class="error">
                ${escapeHtml(data.error)}
            </div>
        `;
    }


    if (
        !data.questions ||
        data.questions.length === 0
    ) {

        return `
            <p>
                No quiz questions were generated.
            </p>
        `;
    }


    return data.questions.map(
        function (question, index) {

            return `

            <div class="quiz-question">

                <h3>

                    ${index + 1}.
                    ${escapeHtml(
                        question.question
                    )}

                </h3>


                <div class="options">

                    ${question.options.map(
                        function (option, optionIndex) {

                            return `

                            <button
                                class="option-button"
                                data-answer="${escapeHtml(option)}"
                                data-correct="${escapeHtml(question.correct_answer)}"
                            >

                                ${String.fromCharCode(
                                    65 + optionIndex
                                )}.

                                ${escapeHtml(option)}

                            </button>

                            `;

                        }
                    ).join("")}

                </div>


                <div
                    class="feedback"
                    hidden
                ></div>


                <div
                    class="explanation"
                    hidden
                >

                    <strong>
                        Explanation:
                    </strong>

                    ${escapeHtml(
                        question.explanation
                    )}

                </div>

            </div>

            `;

        }
    ).join("");
}


// =======================================================
// QUIZ EVENT HANDLERS
// =======================================================

function attachQuizEvents() {

    const optionButtons =
        document.querySelectorAll(
            ".option-button"
        );


    optionButtons.forEach(
        function (button) {

            button.addEventListener(
                "click",
                function () {

                    const question =
                        button.closest(
                            ".quiz-question"
                        );


                    const buttons =
                        question.querySelectorAll(
                            ".option-button"
                        );


                    buttons.forEach(
                        function (item) {

                            item.disabled = true;

                        }
                    );


                    const feedback =
                        question.querySelector(
                            ".feedback"
                        );


                    const explanation =
                        question.querySelector(
                            ".explanation"
                        );


                    const selected =
                        button.dataset.answer;


                    const correct =
                        button.dataset.correct;


                    feedback.hidden = false;

                    explanation.hidden = false;


                    if (
                        selected === correct
                    ) {

                        feedback.className =
                            "feedback correct";

                        feedback.textContent =
                            "✓ Correct!";

                    } else {

                        feedback.className =
                            "feedback wrong";

                        feedback.textContent =
                            "✗ Incorrect. Correct answer: "
                            + correct;

                    }

                }
            );

        }
    );
}


// =======================================================
// GENERATE REQUEST
// =======================================================

async function generate() {

    const text =
        inputText.value.trim();


    errorBox.hidden = true;


    if (!text) {

        errorBox.textContent =
            "Please enter some text.";

        errorBox.hidden = false;

        return;
    }


    generateBtn.disabled = true;

    generateBtn.textContent =
        "Generating...";


    result.innerHTML = `
        <div class="loading">
            EduGenie is thinking...
        </div>
    `;


    copyBtn.disabled = true;


    const endpoints = {

        qa: "/qa",

        explain: "/explain",

        quiz: "/quiz",

        summarize: "/summarize",

        learn: "/learn/recommendations"

    };


    const endpoint =
        endpoints[task.value];


    try {

        const response =
            await fetch(
                endpoint,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        text: text
                    })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.detail ||
                "Request failed."
            );
        }


        // ---------------------------------------------
        // QUIZ
        // ---------------------------------------------

        if (task.value === "quiz") {

            result.innerHTML =
                renderQuiz(data.quiz);

            attachQuizEvents();

            copyBtn.disabled = true;

        }


        // ---------------------------------------------
        // TEXT RESULTS
        // ---------------------------------------------

        else {

            const textResult =
                data.result ||
                "No result returned.";


            result.innerHTML =
                escapeHtml(
                    textResult
                ).replace(
                    /\n/g,
                    "<br>"
                );


            copyBtn.disabled =
                false;

        }


    } catch (error) {

        errorBox.textContent =
            error.message;

        errorBox.hidden =
            false;


        result.innerHTML = `
            <p>
                Something went wrong.
            </p>
        `;


    } finally {

        generateBtn.disabled =
            false;

        generateBtn.textContent =
            "Generate";

    }

}


// =======================================================
// BUTTON EVENTS
// =======================================================

generateBtn.addEventListener(
    "click",
    generate
);


clearBtn.addEventListener(
    "click",
    function () {

        inputText.value = "";

        result.innerHTML =
            "Your AI-generated result will appear here.";

        errorBox.hidden = true;

        copyBtn.disabled = true;

    }
);


// =======================================================
// COPY
// =======================================================

copyBtn.addEventListener(
    "click",
    async function () {

        const text =
            result.innerText;


        await navigator.clipboard.writeText(
            text
        );


        copyBtn.textContent =
            "Copied!";


        setTimeout(
            function () {

                copyBtn.textContent =
                    "Copy";

            },
            1200
        );

    }
);


// =======================================================
// CTRL + ENTER
// =======================================================

inputText.addEventListener(
    "keydown",
    function (event) {

        if (
            (event.ctrlKey ||
             event.metaKey) &&
            event.key === "Enter"
        ) {

            generate();

        }

    }
);


</script>


</body>

</html>
